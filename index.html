<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Календарь пожарной активности: Казахстан</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1 data-i18n="title"></h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="seg" role="group" aria-label="Язык / Language">
        <button type="button" data-lang="ru" aria-pressed="true">Русский</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </header>

    <p class="fatal" id="fatal" hidden></p>

    <main id="app">
      <section class="panel hero3d" id="hero3d" aria-labelledby="h3dTitle"></section>

      <div class="row row-top">
        <section class="panel" aria-labelledby="regionTitle">
          <div class="panel-head">
            <h2 id="regionTitle" data-i18n="regionTitle"></h2>
            <p class="hint" data-i18n="regionHint"></p>
          </div>
          <div class="map-wrap">
            <canvas id="map" role="img"></canvas>
          </div>
          <div class="legend" id="mapLegend"></div>
          <form class="bbox" id="bboxForm" novalidate>
            <label><span data-i18n="south"></span><input id="bS" type="number" step="0.25" min="40" max="56" inputmode="decimal"></label>
            <label><span data-i18n="north"></span><input id="bN" type="number" step="0.25" min="40" max="56" inputmode="decimal"></label>
            <label><span data-i18n="west"></span><input id="bW" type="number" step="0.25" min="46" max="88" inputmode="decimal"></label>
            <label><span data-i18n="east"></span><input id="bE" type="number" step="0.25" min="46" max="88" inputmode="decimal"></label>
            <div class="bbox-actions">
              <button type="submit" class="btn" data-i18n="apply"></button>
              <button type="button" class="btn btn-quiet" id="resetBtn" data-i18n="reset"></button>
            </div>
          </form>
          <p class="error" id="bboxError" role="alert" hidden></p>
        </section>

        <section class="verdict" aria-live="polite">
          <p class="where" id="vWhere"></p>
          <p class="headline" id="vHead"></p>
          <div class="facts" id="vFacts"></div>
          <p class="region-info" id="regionInfo"></p>
        </section>
      </div>

      <section class="panel" id="livePanel" aria-labelledby="liveTitle" hidden></section>

      <section class="panel" id="predPanel" aria-labelledby="predTitle" hidden></section>

      <section class="panel" aria-labelledby="calTitle">
        <div class="panel-head">
          <h2 id="calTitle" data-i18n="calTitle"></h2>
        </div>
        <div class="toolbar">
          <div class="field">
            <span class="field-label" data-i18n="viewLabel"></span>
            <div class="seg" role="group" id="viewSeg">
              <button type="button" data-view="anomaly" aria-pressed="true" data-i18n="viewAnomaly"></button>
              <button type="button" data-view="count" aria-pressed="false" data-i18n="viewCount"></button>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="yFrom" data-i18n="yearsLabel"></label>
            <select id="yFrom"></select>
            <label class="field-label" for="yTo" data-i18n="yearsTo"></label>
            <select id="yTo"></select>
          </div>
          <div class="field">
            <label class="field-label" for="base" data-i18n="baseLabel"></label>
            <select id="base"></select>
          </div>
          <div class="field field-end">
            <button type="button" class="btn" id="csvBtn" data-i18n="csv"></button>
            <button type="button" class="btn btn-quiet" id="pngBtn" data-i18n="png"></button>
          </div>
        </div>
        <div class="row row-cal">
          <div>
            <div class="cal-scroll">
              <div id="calendar" tabindex="0"></div>
            </div>
            <div class="legend" id="calLegend"></div>
          </div>
          <aside class="detail" id="detail" aria-live="polite"></aside>
        </div>
      </section>

      <div class="row row-bottom">
        <section class="panel" aria-labelledby="valTitle">
          <div class="panel-head">
            <h2 id="valTitle" data-i18n="valTitle"></h2>
            <p class="hint" data-i18n="valLead"></p>
          </div>
          <div class="legend" id="valLegend"></div>
          <div id="valChart"></div>
          <p class="readout" id="valRead"></p>
        </section>
        <section class="panel" aria-labelledby="methodTitle">
          <div class="panel-head">
            <h2 id="methodTitle" data-i18n="methodTitle"></h2>
          </div>
          <ul class="method" id="method"></ul>
        </section>
      </div>
    </main>

    <footer class="credit" data-i18n="credit"></footer>
  </div>

  <script src="data/processed/grid.js"></script>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/hero3d.js"></script>
  <script src="js/live.js"></script>
  <script src="js/predict.js"></script>
  <script src="js/anim.js"></script>
</body>
</html>
